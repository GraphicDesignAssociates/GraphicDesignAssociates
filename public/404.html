<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Graphic Design Associates</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // This script takes the current URL and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new URL with only a query string and hash fragment.
      //
      // Auto-detect deployment mode:
      // - GitHub Pages subdirectory (*.github.io/repo): keep 1 path segment
      // - Custom domain (graphicdesignassociates.com): keep 0 path segments
      var pathSegmentsToKeep = window.location.hostname.endsWith('.github.io') ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
